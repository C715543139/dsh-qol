<!doctype html><html data-qol-jump-user-msg="on"><head><meta charset="utf-8"><style>
body { margin:0; font:14px system-ui; background:#eceff3; }
/* --- host replica (per docs: slot sticky bottom composer+16, height:0, flex-end;
       button 34x34 pulled out with margin-top:-34px) --- */
.scroller { position:relative; height:600px; width:400px; margin:20px auto; overflow-y:auto;
  --dsh-composer-height:152px; background:#fff; border:1px solid #ccc; }
.content div { height:100px; border-bottom:1px dashed #ddd; padding:8px; box-sizing:border-box; }
.EvIC1a_toBottomSlot { position:sticky; bottom:calc(var(--dsh-composer-height) + 16px);
  height:0; display:flex; justify-content:flex-end; pointer-events:none; z-index:8; }
.EvIC1a_toBottomSlot button { margin-top:-34px; width:34px; height:34px; flex:none; border:0; border-radius:100px;
  background:#fff; box-shadow:0 0 0 .5px #0000001f, 0 3px 8px #00000008; pointer-events:auto; }
/* --- plugin CSS (verbatim from lib/client.js) --- */
html[data-qol-jump-user-msg="on"] .dsh-qol-jump-anchor {
  position: sticky;
  bottom: calc(var(--dsh-composer-height, 152px) + 58px);
  height: 0;
  display: flex;
  justify-content: flex-end;
  pointer-events: none;
  z-index: 8;
}
html[data-qol-jump-user-msg="on"] [data-conversation-scroll]:not(:has([class$="_toBottomSlot"])) .dsh-qol-jump-anchor {
  bottom: calc(var(--dsh-composer-height, 152px) + 16px);
}
.dsh-qol-jump-nav {
  --dsh-qol-jump-half: 30px;
  --dsw-elevation-stroke-color: var(--dsw-alias-border-l3);
  corner-shape: round;
  margin-top: calc(-2 * var(--dsh-qol-jump-half));
  pointer-events: auto;
  width: 34px;
  height: calc(2 * var(--dsh-qol-jump-half));
  flex: none;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-radius: 17px;
  color: var(--dsw-alias-label-primary);
  background: var(--dsw-alias-button-floating-fill);
  box-shadow: var(--dsw-elevation-panel);
}
.dsh-qol-jump-nav button {
  corner-shape: round;
  width: 34px; height: var(--dsh-qol-jump-half);
  flex: none;
  display: flex; justify-content: center; align-items: center;
  padding: 0; border: 0;
  color: inherit;
  background: transparent;
  cursor: pointer;
}
.dsh-qol-jump-nav button:hover { background: var(--dsw-alias-button-floating-hover); }
.dsh-qol-jump-nav .dsh-qol-jump-next { box-shadow: inset 0 1px 0 var(--dsw-alias-border-l3); }
.dsh-qol-jump-nav .dsh-qol-jump-next svg { transform: rotate(180deg); }
html:not([data-qol-jump-user-msg="on"]) .dsh-qol-jump-anchor { display: none !important; }
/* --- host tokens (subset, light) --- */
.scroller { --dsw-alias-label-primary:#000; --dsw-alias-button-floating-fill:#fff;
  --dsw-alias-button-floating-hover:#f5f6f7; --dsw-alias-border-l3:#0000001f;
  --dsw-elevation-stroke-color:#00000029;
  --dsw-elevation-stroke:0 0 0 .5px var(--dsw-elevation-stroke-color);
  --dsw-elevation-panel:var(--dsw-elevation-stroke), 0 3px 8px 0 #00000008, 0 0 16px 0 #00000005; }
</style></head><body>
<div class="scroller" data-conversation-scroll>

  </div></div>
</div>
<script>
var c = document.getElementById('content');
